name: docs

# A build gate only. --strict turns MkDocs warnings (dead internal links,
# missing nav targets) into a failed build, so a renamed page or a stale nav
# entry is caught in review. Publishing is handled by the unified docs hub that
# aggregates this repo's docs/ alongside the other projects' — this repo does
# not deploy its own site.

on:
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install mkdocs-material

      - name: Build (strict)
        run: mkdocs build --strict --site-dir _site

  # The unified docs hub (rostamlabs/docs) imports this repo's docs/ at build
  # time, so a docs change here won't reach the published site until the hub
  # rebuilds. On a push to main, fire a repository_dispatch so the hub redeploys
  # immediately instead of waiting for its daily schedule.
  #
  # Requires a repo secret DOCS_DISPATCH_TOKEN — a token with Contents:write on
  # rostamlabs/docs. The step is guarded on it, so this no-ops (never fails) when
  # the secret is absent, including on forks and PRs.
  notify-hub:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Trigger docs hub rebuild
        if: env.DOCS_DISPATCH_TOKEN != ''
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rostamlabs/docs/dispatches \
            -d '{"event_type":"rebuild-docs"}'
