name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      # Golden e2e tests skip without the exported model dir (weights are
      # never committed); unit tests, kernel sweeps, and pool tests run.
      - run: go test ./...
      - name: race
        run: go test -race ./...
      - name: c-shared build (Python bindings ABI)
        run: CGO_ENABLED=1 go build -buildmode=c-shared -o /tmp/librembed.so ./python/capi

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: "386" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  # NOTE: GitHub-hosted x64 runners (Ice Lake-SP / Zen 3) lack AVX-VNNI,
  # so the R7 full-int8 tests skip in CI. Closing this needs an Intel SDE
  # job (sde64 -adl -- go test ./internal/tensor) once Actions billing is
  # restored — tracked as follow-up; the path is exercised on every local
  # run of the suite on VNNI hardware.
  arm64-qemu:
    # The NEON kernels (fp32 gemm, WORD-encoded int8 gemm, dot4) are proven
    # here, not just cross-compiled: the arm64 test binaries run under
    # qemu-user emulation, including the kernel sweeps against float64
    # references. Perf means nothing under qemu; correctness means
    # everything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: install qemu-user
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static
      - name: build arm64 test binaries
        # The root package is deliberately omitted: its golden battery
        # fetches real model weights over the network, which is painfully
        # slow under qemu. The full root suite WAS run manually on arm64
        # under qemu for the R3 PR; these four packages are the standing
        # per-commit net (they cover every arm64 assembly kernel).
        run: |
          mkdir -p /tmp/arm64
          # tokenizer/bpe is absent on purpose: it has no assembly, and its
          # fixture tests need vocab files this job does not fetch — the
          # golden job runs them against the hub cache instead.
          for pkg in ./internal/tensor ./internal/model ./internal/safetensors ./tokenizer; do
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/arm64/$(basename $pkg).test $pkg
          done
      - name: run under qemu
        run: |
          for t in /tmp/arm64/*.test; do
            echo "== $t"; qemu-aarch64-static $t
          done

  golden:
    # The full golden validation against committed ONNX-reference outputs,
    # with real weights fetched through rembed's own hub loader (dogfooding
    # the pure-Go download path) and cached between runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rembed
          key: rembed-models-v4
      - name: fetch models via the hub loader
        run: |
          go run ./cmd/rembed embed -model sentence-transformers/all-MiniLM-L6-v2 "warm" > /dev/null
          go run ./cmd/rembed embed -model BAAI/bge-small-en-v1.5 "warm" > /dev/null
          go run ./cmd/rembed embed -model sentence-transformers/all-mpnet-base-v2 "warm" > /dev/null
          go run ./cmd/rembed embed -model sentence-transformers/all-distilroberta-v1 "warm" > /dev/null
          go run ./cmd/rembed embed -model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 "warm" > /dev/null
      - name: golden suite (fp32, int8, cls, allocs, concurrency)
        run: |
          export REMBED_MODEL_DIR=~/.cache/rembed/sentence-transformers--all-MiniLM-L6-v2
          export REMBED_MODEL_BGE=~/.cache/rembed/BAAI--bge-small-en-v1.5
          export REMBED_MODEL_MPNET=~/.cache/rembed/sentence-transformers--all-mpnet-base-v2
          export REMBED_MODEL_ROBERTA=~/.cache/rembed/sentence-transformers--all-distilroberta-v1
          export REMBED_MODEL_XLMR=~/.cache/rembed/sentence-transformers--paraphrase-multilingual-MiniLM-L12-v2
          go test -v -run "Golden|SteadyState|Concurrent|WithWorkers|Batch|Tokens" . 2>&1 | tail -30
          go test -run "Golden|SteadyState|Concurrent|WithWorkers|Batch|Tokens" .
          # The BPE fixture needs real vocab/merges files; the hub cache
          # fetched above has them, so the token-for-token HF fixture runs
          # here rather than silently skipping suite-wide.
          go test -v ./tokenizer/bpe
          go test -v ./tokenizer/sentencepiece
